[project]
name = "speech-to-text"
version = "0.0.1"
description = ""
readme = "README.md"

# We should be able to use later versions of Python once this is released to PyPI:
# https://github.com/openai/whisper/pull/2435
requires-python = "==3.11.11"

dependencies = [
    "boto3>=1.36.9",
    "honeybadger>=0.20.3",
    "openai-whisper>=20240930",
    "python-dotenv[cli]>=1.0.1",
    "triton==3.2 ; (platform_machine == 'x86_64' and sys_platform == 'linux') or sys_platform == 'linux2'",
]

[tool.ruff.lint]
# Rules surfaced by newer ruff versions that we want to revisit and fix
# properly rather than suppress inline. See:
# https://github.com/sul-dlss/speech-to-text/issues/177
ignore = [
    "LOG015",  # logging call on root logger
    "RUF059",  # unpacked variable never used
    "BLE001",  # blind `except Exception`
    "B017",    # `pytest.raises(Exception)` blind assert
    "SIM115",  # file opened without a context manager
    "PLW1510", # `subprocess.run` without explicit `check`
    "DTZ005",  # `datetime.now()` without `tz` argument
]

[dependency-groups]
dev = [
    "boto3-stubs[s3,sqs,sts]>=1.36.9",
    "moto[s3,sqs,sts]>=5.0.27",
    "mypy>=1.14.1",
    "pytest>=8.3.4",
    "pytest-cov>=5.0.0",
    "requests>=2.32.3",
    "ruff>=0.9.4",
    "types-requests>=2.31.0.6",
]
